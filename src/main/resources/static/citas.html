<!DOCTYPE html>
<html lang="es">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Reservar cita</title></head>
<body>
  <h1>Reservar cita médica</h1>
  <label>Profesional <input id="profesional" placeholder="Nombre del profesional"></label><br>
  <label>Fecha y hora <input id="fechaHora" type="datetime-local"></label><br>
  <label>Documento del paciente <input id="pacienteId" placeholder="Documento"></label><br>
  <button id="btnReservar">Reservar</button>
  <p id="mensaje" role="status"></p>
<script>
document.getElementById('btnReservar').addEventListener('click', async () => {
  const fecha = document.getElementById('fechaHora').value;
  const body = {
    profesional: document.getElementById('profesional').value,
    fechaHora: fecha ? fecha + ':00' : null,
    pacienteId: document.getElementById('pacienteId').value
  };
  try {
    const r = await fetch('/api/citas', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(body)
    });
    document.getElementById('mensaje').textContent =
      r.status === 201 ? 'Cita reservada' :
      r.status === 409 ? 'Horario no disponible' : 'Datos inválidos';
  } catch (e) {
    document.getElementById('mensaje').textContent = 'Error de conexión';
  }
});
</script>
</body></html>
